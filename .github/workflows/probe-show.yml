# 節目探針 —— 手動觸發，回答「該不該收這檔」。
#
# 跑在 Actions 而不是雲端：雲端容器連不到 iTunes（2026-08-19 實測 403 Tunnel，
# 跟五個金融端點同一個封鎖），Actions 連得到。
#
# **輸入用逗號分隔，而且一定要加引號。** 第一版沒加引號、用空白分隔，於是
# `search:Sharp Tech` 被 shell 切成兩個參數：前者搜到一檔美式足球節目、後者被當成
# AppleID。而表格照樣印出五行真數字——**失敗沒有長得像失敗**。
#
# 結果寫進 job summary 而不是 artifact：artifact 要點三層才看得到，
# 而這支的產出就是要給人看的。順帶拿掉了會固定響的 Node 20 警告。

name: probe-show

on:
  workflow_dispatch:
    inputs:
      idents:
        description: "AppleID 或 search:<節目名>，用逗號分隔"
        required: true
        default: "296237493,search:BG2Pod,search:Sharp Tech Ben Thompson,1592743188,search:Top Traders Unplugged"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 探
        env:
          IDENTS: ${{ inputs.idents }}
        run: |
          python tools/probe_show.py /tmp/probe.json "$IDENTS" | tee /tmp/out.txt
          {
            echo '## 節目探針'
            echo '```'
            cat /tmp/out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
